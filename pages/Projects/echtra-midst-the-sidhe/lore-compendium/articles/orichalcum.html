<article class="echtra-article archive-article"><header class="article-header"><p class="article-type">MAGICZNY MATERIAŁ · FIENDY</p><h1>Orichalcum</h1><p class="article-lead">Metal o złotej barwie z czerwonym odcieniem.</p></header><section class="article-section"><p>Orichalcum omija odporności Fiendów i może zadawać dodatkowe obrażenia siłowe. Pancerz z orichalcum zapewnia również dodatkową ochronę.</p></section></article>
