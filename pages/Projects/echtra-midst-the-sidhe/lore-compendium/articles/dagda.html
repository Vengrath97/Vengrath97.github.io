<article class="echtra-article archive-article"><header class="article-header"><p class="article-type">BÓSTWO</p><h1>Dagda</h1><p class="article-lead">All-Father, bóg mądrości, życia i wspólnoty.</p></header><section class="article-section"><p>Dagda jest potężną, ojcowską postacią. Jego kapłani, Starsi Kotła, pełnią role sędziów, nauczycieli i opiekunów wspólnot; świętem Dagdy jest Dzień Dębu.</p></section></article>
