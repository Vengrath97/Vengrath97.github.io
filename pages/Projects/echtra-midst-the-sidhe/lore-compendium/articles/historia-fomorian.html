<article class="echtra-article archive-article"><header class="article-header"><p class="article-type">FOMORIANIE · HISTORIA</p><h1>Historia Fomorian</h1><p class="article-lead">Dzieje wojny Fomorian z bogami na Ziemiach Zachodu.</p></header><section class="article-section"><p>Fomorianie i bogowie walczyli na Ziemiach Zachodu. Po zwycięstwie bogów ich drogi rozeszły się, a Fomorianie pozostali związani z dawną ojczyzną, podczas gdy bogowie przybyli do Irgaeli.</p></section></article>
