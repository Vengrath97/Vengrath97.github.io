<article class="echtra-article archive-article"><header class="article-header"><p class="article-type">MAGICZNY PRZEDMIOT · BROŃ</p><h1>Złota Krawędź</h1><p class="article-lead">Auric Edge — legendarna klinga wykuta z orichalcum.</p></header><section class="article-section"><p>Złota Krawędź jest wykonana z doskonałego orichalcum. Merrick posiada pozostałości ostrza i chce je odtworzyć, potrzebując orichalcum do przywrócenia jego zaklęć.</p></section></article>
