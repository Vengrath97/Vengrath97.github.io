<article class="echtra-article archive-article"><header class="article-header"><p class="article-type">SIDHE · DWÓR</p><h1>Dwór Zimy</h1><p class="article-lead">Zimowy aspekt porządku Sidhe.</p></header><section class="article-section"><p>Zima jest jednym z czterech rytmów, których równowaga utrzymuje cykl świata. W kampanii jej nadnaturalne wypaczenie jest związane z Cailleach i Krainami Zawsze Zimy.</p></section></article>
