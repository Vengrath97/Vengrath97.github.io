<article class="echtra-article archive-article"><header class="article-header"><p class="article-type">SIDHE · DWORY</p><h1>Seelie i Unseelie</h1><p class="article-lead">Dwa nurty dworskiego świata Sidhe.</p></header><section class="article-section"><p>W kampanii równowaga pomiędzy Seelie i Unseelie zostaje naruszona po pokonaniu Fomorian. Konflikt dworów prowadzi bohaterów do Innego Świata i wiąże się z uwięzieniem Królowej Lata przez Króla Jesieni.</p></section></article>
