<article class="echtra-article archive-article"><header class="article-header"><p class="article-type">ISTOTY MAGICZNE</p><h1>Feniksy</h1><p class="article-lead">Istoty związane ze spadającymi gwiazdami i ogniem.</p></header><section class="article-section"><p>Feniks może narodzić się, gdy spadająca gwiazda trafia w płonący ogień. To jedno z niezwykłych zjawisk łączących kosmiczne zdarzenia z magiczną fauną Irgaeli.</p></section></article>
