<article class="echtra-article archive-article"><header class="article-header"><p class="article-type">POSTACI · TRESSYM</p><h1>Niamh</h1><p class="article-lead">Młoda tressymka i przyjaciółka Fianny.</p></header><section class="article-section"><p>Niamh jest małą, skrzydlatą kotką z dworu Seelie. Jest niezwykle senna, ciekawska i przyjazna. W jej pobliżu pojawiają się świetliste niebieskie motyle; później okazuje się, że jej przeszłość wiąże ją z Księżniczką Wiosny.</p></section></article>
