<article class="echtra-article archive-article"><header class="article-header"><p class="article-type">SIDHE · ZWIastun</p><h1>Dullahan</h1><p class="article-lead">Bezgłowy jeździec, zwiastun śmierci i herold Dzikiego Gonu.</p></header><section class="article-section"><h2>Samhain</h2><p>Dullahan przybywa do Cùilfeorny podczas Samhain. Zabiera jedną ofiarę i ogłasza przepowiednię, że za rok Dziki Gon zabierze wszystkich. Jest bezpośrednim narzędziem planu Morrigan.</p></section></article>
