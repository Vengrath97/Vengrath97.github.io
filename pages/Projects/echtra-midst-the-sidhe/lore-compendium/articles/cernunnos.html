<article class="echtra-article archive-article"><header class="article-header"><p class="article-type">BÓSTWO</p><h1>Cernunnos</h1><p class="article-lead">Bóg dzikiej natury, zwierząt i przemiany.</p></header><section class="article-section"><p>Cernunnos reprezentuje wolność, instynkt i nieprzewidywalność świata przyrody. Jego wyznawcy, Rogaci, są myśliwymi, tropicielami i druidami.</p></section></article>
