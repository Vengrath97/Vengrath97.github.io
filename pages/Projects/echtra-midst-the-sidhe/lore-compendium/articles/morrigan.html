<article class="echtra-article archive-article"><header class="article-header"><p class="article-type">BÓSTWO</p><h1>Morrigan</h1><p class="article-lead">Widmowa Królowa, bogini wojny, losu, śmierci i przeznaczenia.</p></header><section class="article-section"><p>Morrigan działa poprzez przepowiednie, konflikty i manipulowanie losem. Jej kapłani, Kruki Losu, są taktykami, szpiegami i wojownikami; w kampanii stoi za planem Dzikiego Gonu.</p></section></article>
