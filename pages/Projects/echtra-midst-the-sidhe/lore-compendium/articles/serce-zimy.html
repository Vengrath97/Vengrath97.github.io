<article class="echtra-article archive-article"><header class="article-header"><p class="article-type">MAGICZNY PRZEDMIOT · CAILLEACH</p><h1>Serce Zimy</h1><p class="article-lead">Potężny kryształ podtrzymujący wpływ Cailleach na zimę.</p></header><section class="article-section"><p>Serce Zimy znajduje się w Krainach Zawsze Zimy i jest strzeżone przez Caoránacha. Zniszczenie kryształu kończy nadnaturalną zimę, ale uwalnia konsekwencje uwięzione pod lodem.</p></section></article>
