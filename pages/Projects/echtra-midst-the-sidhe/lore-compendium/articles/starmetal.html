<article class="echtra-article archive-article"><header class="article-header"><p class="article-type">MAGICZNY MATERIAŁ · GWIAZDY</p><h1>Starmetal</h1><p class="article-lead">Metal meteoryczny związany ze spadającymi gwiazdami.</p></header><section class="article-section"><p>Starmetal jest szczególnie skuteczny przeciw Aberracjom i Monstrom. Spadające gwiazdy są również źródłem niezwykłych istot, takich jak Tressym i Feniksy.</p></section></article>
