<article class="echtra-article archive-article"><header class="article-header"><p class="article-type">SIDHE · SABAT</p><h1>Maeve</h1><p class="article-lead">Maeve, zwana także Sarną, jest związana z sabatem wiedźm i tajemnicą Balora.</p></header><section class="article-section"><p>Materiały wskazują, że Maeve nosi znamię Balora. Legendy głoszą, że potomek Balora z takim znamieniem może zgładzić nieśmiertelnego Króla Fomorian.</p></section></article>
