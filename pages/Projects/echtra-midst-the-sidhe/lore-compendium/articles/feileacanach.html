<article class="echtra-article archive-article"><header class="article-header"><p class="article-type">WIELKI WYRМ · KRYSZTAŁ</p><h1>Féileacánach, Kryształowy Wyrm</h1><p class="article-lead">Wyrm pokonany przez Dagdę i Danu.</p></header><section class="article-section"><p>Dagda i Danu cisnęli na Féileacánacha górę, która stała się Kościaną Górą. Później związano z tym miejscem próbę osadzenia esencji Wyrma w Wybrańcu.</p></section></article>
