<article class="echtra-article archive-article"><header class="article-header"><p class="article-type">MAGICZNY PRZEDMIOT · ARTEFAKT</p><h1>Claíomh Solais</h1><p class="article-lead">Miecz Światła, jedna z czterech skarbów Tuatha Dé Danann.</p></header><section class="article-section"><p>Claíomh Solais był dzierżony przez Nuadę podczas dawnych wojen z Fomorianami. Jest związany z przepowiednią powrotu gigantów i światłem, którego nie może skazić brud ani krew.</p></section></article>
