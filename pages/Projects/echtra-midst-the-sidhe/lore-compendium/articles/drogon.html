<article class="echtra-article archive-article"><header class="article-header"><p class="article-type">POSTACI · DRAKON</p><h1>Drogon</h1><p class="article-lead">Drakon wysłany na próby przez Starą Tessę.</p></header><section class="article-section"><p>Stara Tessa wysłała Drogona na jego próby i mogła w pewien sposób zmienić ich przebieg, kierując się własnymi wizjami. Caoránach wyczuwa w jego kościach i duszy obecność tajemniczej śpiącej istoty.</p></section></article>
