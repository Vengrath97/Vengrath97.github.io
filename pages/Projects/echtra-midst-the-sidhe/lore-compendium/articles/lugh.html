<article class="echtra-article archive-article"><header class="article-header"><p class="article-type">BÓSTWO</p><h1>Lugh</h1><p class="article-lead">Długoręki, bóg słońca, sztuki, wojny i mistrzostwa.</p></header><section class="article-section"><p>Lugh wymaga doskonałości, dyscypliny i rozwijania umiejętności. Jego kapłani są rzemieślnikami, żołnierzami i nauczycielami.</p></section></article>
