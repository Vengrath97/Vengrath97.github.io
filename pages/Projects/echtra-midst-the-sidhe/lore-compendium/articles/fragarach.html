<article class="echtra-article archive-article"><header class="article-header"><p class="article-type">MAGICZNY PRZEDMIOT · BROŃ</p><h1>Fragarach, Odwetnik</h1><p class="article-lead">Legendarny miecz znany jako Answerer.</p></header><section class="article-section"><p>Fragarach był noszony przez królów i czempionów Tuatha Dé Danann. Jego natura związana jest z natychmiastowym odwetem za cios zadany właścicielowi.</p></section></article>
