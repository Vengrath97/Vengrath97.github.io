<article class="echtra-article archive-article"><header class="article-header"><p class="article-type">MAGICZNY PRZEDMIOT</p><h1>Gleislinne</h1><p class="article-lead">Pozycja zachowana w katalogu magicznych przedmiotów Echtry.</p></header><section class="article-section"><p>Nazwa Gleislinne występuje w strukturze katalogu kompendium. Dostarczony materiał źródłowy nie zawiera jednak wystarczającego opisu właściwości przedmiotu, dlatego nie dopisuję niepotwierdzonego lore.</p></section></article>
