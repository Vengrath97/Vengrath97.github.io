<article class="echtra-article archive-article"><header class="article-header"><p class="article-type">ISTOTY MAGICZNE · CIENIE</p><h1>Scáileanna</h1><p class="article-lead">Widma przeszłości przypominające dziecięce sylwetki utkane z cienia.</p></header><section class="article-section"><p>Scáileanna pragną odbierać szczęście. Można je przepędzić dobrym humorem i żartami. Są wrażliwe na ogień i światło, a szczególnie niebezpieczne stają się w ciemności.</p></section></article>
