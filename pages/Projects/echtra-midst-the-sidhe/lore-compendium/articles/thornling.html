<article class="echtra-article archive-article"><header class="article-header"><p class="article-type">ISTOTY MAGICZNE · FAE</p><h1>Thornling</h1><p class="article-lead">Fae przypominające splątane korzenie i gałęzie.</p></header><section class="article-section"><p>Thornlingi są inteligentne, ciekawskie i perfekcyjnie odtwarzają zasłyszane dźwięki oraz mowę. Lubią błyskotki i nietypowe przedmioty.</p></section></article>
