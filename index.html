<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diablo — Shattered Codex</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
<header>
  <div class="brand"><div class="sigil"><span>✦</span></div><div class="logo">Diablo<span>Shattered Codex</span></div></div><div class="tagline">A visual index of the dark archive</div>
  <div class="controls">
    <input id="search" type="search" placeholder="Search…" aria-label="Search">
    <button id="shuffle" type="button">Reroll the shards</button>
  </div>
</header>
<nav id="filters" class="filters" aria-label="Categories">
  <button class="filter active" data-cat="All">All</button>
  <button class="filter" data-cat="Projects">Projects</button>
  <button class="filter" data-cat="People">People</button>
  <button class="filter" data-cat="Ideas">Ideas</button>
  <button class="filter" data-cat="Media">Media</button>
  <button class="filter" data-cat="Reference">Reference</button>
  <button class="filter" data-cat="Archive">Archive</button>
</nav>
<main id="viewport" class="viewport">
  <div id="canvas" class="canvas"></div>
</main>
</div>
<script src="app.js"></script>
</body>
</html>
